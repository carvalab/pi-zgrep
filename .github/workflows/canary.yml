# Weekly canary: run the test suite against @zvec/zvec-grep@latest and
# @earendil-works/pi-coding-agent@latest.
#
# Dependabot only sees releases outside the engine range pinned in
# package.json (dependencies["@zvec/zvec-grep"]) and inside the pi range
# (devDependencies["@earendil-works/pi-coding-agent"]). This job catches
# breakage inside the allowed ranges and drift between our pins and upstream
# latest: CLI flag changes, output shape changes (the fixtures under
# test/fixtures/ are the tripwire), e2e behavior on the real engine, and — for
# pi — the system prompt our guidance has to land in (test/prompt.test.ts reads
# it back through the SDK, so a pi release that stops rendering promptSnippet
# or promptGuidelines fails here even though package.json still allows it).
#
# Behavior (modeled on the community canary pattern, e.g. smoke tests that
# auto-open and auto-close a tracking issue):
#   - Schedule: Mondays 06:00 UTC, plus a manual workflow_dispatch button.
#   - On failure: opens or comments on a single tracking issue labeled canary.
#   - On success: closes any open tracking issue with a recovery comment.

name: Upstream canary

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      passed: ${{ steps.tests.outputs.passed }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Overlay the engine with upstream latest
        run: |
          latest=$(npm view @zvec/zvec-grep version)
          allowed=$(node -p "require('./package.json').dependencies['@zvec/zvec-grep']")
          echo "canary engine: @zvec/zvec-grep@$latest (package.json allows $allowed)"
          npm install --ignore-scripts --no-save @zvec/zvec-grep@latest

      # Same idea for the harness: `npm test` includes test/prompt.test.ts,
      # which renders our extension through pi's SDK and asserts the tool
      # snippet and guidelines reach the model. Running it on the newest pi is
      # the point — a pi release that drops promptSnippet or stops registering
      # promptGuidelines breaks users on `@latest` long before our range allows
      # it, and nothing else in the suite would notice.
      - name: Overlay pi with upstream latest
        run: |
          latest=$(npm view @earendil-works/pi-coding-agent version)
          allowed=$(node -p "require('./package.json').devDependencies['@earendil-works/pi-coding-agent']")
          echo "canary pi: @earendil-works/pi-coding-agent@$latest (package.json allows $allowed)"
          npm install --ignore-scripts --no-save \
            @earendil-works/pi-coding-agent@latest \
            @earendil-works/pi-tui@latest
          # Read the manifest by path: pi does not export "./package.json".
          node -p "'installed pi: ' + require('./node_modules/@earendil-works/pi-coding-agent/package.json').version"
          node -p "'installed pi-tui: ' + require('./node_modules/@earendil-works/pi-tui/package.json').version"

      # Informational only: pi publishes no `next` tag today (dist-tags are
      # `latest` and `legacy-node20`), so this logs instead of installing.
      - name: Report pi dist-tags
        continue-on-error: true
        run: |
          npm view @earendil-works/pi-coding-agent dist-tags
          next=$(npm view @earendil-works/pi-coding-agent dist-tags.next || true)
          if [ -n "$next" ] && [ "$next" != "undefined" ]; then
            echo "pi@next is $next — not installed by this job"
          else
            echo "no pi@next dist-tag"
          fi

      - name: Unit + e2e against latest
        id: tests
        run: |
          set +e
          {
            npm test
            ZG_TEST_E2E=1 npm run test:e2e
          } 2>&1 | tee canary-output.txt
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi
          # Keep going so the notify job can open/close the tracking issue.
          exit 0

      - name: Save full output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: canary-output
          path: canary-output.txt
          retention-days: 14

  notify:
    needs: canary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Find the tracking issue
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          number=$(gh issue list --label canary --state open --json number --jq '.[0].number' --limit 1 || echo "")
          echo "number=${number}" >> "$GITHUB_OUTPUT"

      - name: Open or comment on failure
        if: needs.canary.outputs.passed == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EXISTING: ${{ steps.find.outputs.number }}
        run: |
          DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          BODY=$(cat <<MSG
          Canary failed against @zvec/zvec-grep@latest or @earendil-works/pi-coding-agent@latest at ${DATE}.

          Unit fixtures or e2e disagree with upstream latest engine output, or pi no longer renders the tool snippet/guidelines into the system prompt (test/prompt.test.ts). Pin back with `PI_ZG_BIN`, or adapt the parser/args or the prompt registration after reading the failing assertion (see AGENTS.md, "Update procedure when upstream releases").

          Full log: [run](${RUN_URL})

          (Auto-generated by .github/workflows/canary.yml)
          MSG
          )
          if [ -n "${EXISTING}" ]; then
            gh issue comment "${EXISTING}" --body "${BODY}"
          else
            gh issue create --title "[canary] tests fail against @zvec/zvec-grep@latest" --label "canary,triage" --body "${BODY}"
          fi

      - name: Close on recovery
        if: needs.canary.outputs.passed == 'true' && steps.find.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ steps.find.outputs.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          gh issue comment "${NUMBER}" --body "Recovered at ${DATE}: tests pass against upstream latest. [run](${RUN_URL})"
          gh issue close "${NUMBER}" --reason completed
