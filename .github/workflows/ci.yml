# Commit messages and release PR descriptions run through the `humanizer` skill per `~/.pi/agent/AGENTS.md`.
name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  ci:
    runs-on: ubuntu-latest
    # F6: matrix matches the engines.node floor (22.18) and the version
    # we develop against (24). Both must pass for the release gate.
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test
