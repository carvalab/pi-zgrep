# Commit messages and release PR descriptions run through the `humanizer` skill per `~/.pi/agent/AGENTS.md`.
name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  ci:
    runs-on: ${{ matrix.os }}
    # F6: matrix matches the engines.node floor (22.18) and the version
    # we develop against (24). Both must pass for the release gate.
    strategy:
      fail-fast: false
      matrix:
        # macOS is here because @zvec/zvec-grep ships per-platform native
        # payloads: darwin-arm64 and darwin-x64 are two of them, and their
        # checksum / exec-bit / spawn path is macOS-only. macos-latest is Apple
        # Silicon; macos-15-intel is the x64 image (macos-13 is retired).
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: ["22", "24", "26"]
        # Intel macOS is the slowest runner, so it covers only one node version;
        # that is enough to prove the darwin-x64 payload resolves and runs.
        include:
          - os: macos-15-intel
            node-version: "24"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test
      # Real engine: downloads the embedding model on a cold cache. Cached per
      # OS and architecture so later runs stay offline.
      - uses: actions/cache@v6
        with:
          path: ~/.zvec-grep/models
          key: zvec-models-${{ runner.os }}-${{ runner.arch }}
      # env, not a VAR=value prefix: Windows runs these steps in pwsh.
      - run: node --test test/model-load.test.ts
        env:
          ZG_TEST_MODEL: "1"

  # Real pi session against a pinned free OpenRouter model. Skips itself when
  # the secret is absent, so forks without it still pass. One OS is enough: the
  # matrix above already covers Windows.
  pi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm install -g @earendil-works/pi-coding-agent
      - run: npm ci
      - run: npm run test:pi
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

  # Which zg the extension actually runs, per user setup: the packed tarball
  # installed with and without lifecycle scripts, an old global 0.2.2 on PATH,
  # PI_ZG_BIN overrides (0.2.x, 0.3.x, missing), and the 0.6.0 -> 0.7.0 upgrade
  # that has to rebuild a 0.2.x index. It installs real published versions, so
  # it needs the npm registry, and S6 downloads a 32 MB embedding model.
  upgrade:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run test:upgrade
