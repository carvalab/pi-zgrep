# Commit messages and release PR descriptions run through the `humanizer` skill per `~/.pi/agent/AGENTS.md`.
name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  ci:
    runs-on: ${{ matrix.os }}
    # F6: matrix matches the engines.node floor (22.18) and the version
    # we develop against (24). Both must pass for the release gate.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test
      # Real engine: downloads the embedding model on a cold cache. Cached per
      # OS and architecture so later runs stay offline.
      - uses: actions/cache@v6
        with:
          path: ~/.zvec-grep/models
          key: zvec-models-${{ runner.os }}-${{ runner.arch }}
      # env, not a VAR=value prefix: Windows runs these steps in pwsh.
      - run: node --test test/model-load.test.ts
        env:
          ZG_TEST_MODEL: "1"

  # Real pi session against openrouter/free. Skips itself when the secret is
  # absent, so forks without it still pass. One OS is enough: the matrix
  # above already covers Windows.
  pi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm install -g @earendil-works/pi-coding-agent
      - run: npm ci
      - run: npm run test:pi
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
