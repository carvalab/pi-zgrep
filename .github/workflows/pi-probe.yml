# Temporary probe workflow, used to pick the pinned integration model and to
# run the negative proof on a branch (it needs the repo secret, which is only
# available in Actions). Delete it once the pins are settled.
name: PI integration probe
on:
  workflow_dispatch:
    inputs:
      model:
        description: Primary model id (empty = the script's pinned default)
        required: false
        type: string
        default: ""
      backup:
        description: Backup model id (empty = the script's pinned default)
        required: false
        type: string
        default: ""
      thinking:
        description: Thinking level (empty = the script's per-model default)
        required: false
        type: string
        default: ""
      negative:
        description: 1 runs the negative proof (must exit 1)
        required: false
        type: string
        default: "0"
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm install -g @earendil-works/pi-coding-agent
      - run: npm ci
      - run: npm run test:pi
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PI_ZG_IT_MODEL: ${{ inputs.model }}
          PI_ZG_IT_BACKUP_MODEL: ${{ inputs.backup }}
          PI_ZG_IT_THINKING: ${{ inputs.thinking }}
          PI_ZG_IT_NEGATIVE: ${{ inputs.negative }}
