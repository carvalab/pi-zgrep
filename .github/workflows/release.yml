name: Release
on:
  push: { tags: ["v*"] }
permissions:
  id-token: write
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 26, registry-url: "https://registry.npmjs.org" }
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm run test
      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag v$TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi
      - name: Publish (skip when the version is already on npm)
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "pi-zgrep@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "pi-zgrep@$PKG_VERSION is already published, skipping"
          else
            npm publish --provenance
          fi

  release:
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - uses: actions/checkout@v7
      - name: Create or update the GitHub release from the curated changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES=$(awk -v tag="$GITHUB_REF_NAME" '
            $0 == "## [" tag "]" || $0 ~ "^## \\[" tag "\\] " { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            echo "::error::CHANGELOG.md has no section for $GITHUB_REF_NAME."
            echo "::error::Curate the release notes before tagging: run git-cliff for a raw draft, rewrite it as user-facing notes, commit CHANGELOG.md, then re-tag."
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "$NOTES"
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "$NOTES"
          fi
