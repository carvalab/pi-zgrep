# git-cliff configuration for pi-zgrep.
#
# Draft helper only: run `git-cliff` to get the raw per-tag commit list, then
# rewrite the section as user-facing notes in CHANGELOG.md before tagging.
# The release workflow reads the curated section from CHANGELOG.md; it does
# not run git-cliff.

[changelog]
header = """
# Changelog

All notable changes to pi-zgrep. Commit subjects are quoted verbatim because
the repo does not use Conventional Commits.

"""
body = """
## [{% if version %}{{ version }}{% else %}Unreleased{% endif %}] - {{ timestamp | date(format="%Y-%m-%d") }}

{% for commit in commits -%}
- {{ commit.message | split(pat="\\n") | first | trim }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/carvalab/pi-zgrep/commit/{{ commit.id }}))
{% endfor -%}
"""
footer = "<!-- generated by git-cliff -->"
trim = true

[git]
conventional_commits = false
filter_commits = false
split_commits = false
tag_pattern = "v*"
sort_commits = "oldest"
